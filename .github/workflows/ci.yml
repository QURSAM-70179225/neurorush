name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - run: python3 tool/check_listing.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  functions:
    name: Cloud Functions tests (unit, rules, emulators)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:emulators

  release-aab:
    name: Release AAB (only when signing secrets exist)
    needs: [app, functions]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_KEYSTORE == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: env.HAS_KEYSTORE == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Restore signing key and Firebase config
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          keyAlias=upload
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          PROPS
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          echo "admobAppId=${{ secrets.ADMOB_APP_ID }}" >> android/gradle.properties
      - name: Build
        if: env.HAS_KEYSTORE == 'true'
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols
          --dart-define=SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}
          --dart-define=PRIVACY_URL=${{ secrets.PRIVACY_URL }}
          --dart-define=DELETE_ACCOUNT_URL=${{ secrets.DELETE_ACCOUNT_URL }}
          --dart-define=ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID }}
          --dart-define=ADMOB_REWARDED_ID=${{ secrets.ADMOB_REWARDED_ID }}
      - if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols
